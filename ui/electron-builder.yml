appId: gov.inl.insights
productName: CyOTE Insights
copyright: Copyright © Battelle Energy Alliance, LLC

directories:
  output: ../dist-electron

icon: public/icon

files:
  - dist/**/*
  - main-electron.cjs
  - main-electron-preload.cjs
  - package.json
  - "!**/.vscode"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,*.d.ts,*.bak}"

extraResources:
  - from: ../api/build/local
    to: api

asarUnpack:
  - "**/*.node"

win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
  # INL code-signing cert (DOE - Idaho National Laboratory).
  signtoolOptions:
    certificateSha1: EA4A63AA47C1E4A70805685DC7D6E782AC6846A6
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.entrust.net/rfc3161ts2
  extraResources:
    - from: ../vendor/node-win-x64/node.exe
      to: node.exe

nsis:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.developer-tools
  identity: null
  extraResources:
    - from: ../vendor/node-mac-arm64/node
      to: node

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
